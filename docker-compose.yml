services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: apaar
      POSTGRES_PASSWORD: apaar_dev
      POSTGRES_DB: apaar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata: